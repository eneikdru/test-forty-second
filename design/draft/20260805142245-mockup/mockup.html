<body class="bg-background text-on-background min-h-screen pb-24 selection:bg-primary-container selection:text-on-primary-container">
<!-- Top App Bar (From JSON) -->
<header class="bg-surface/60 backdrop-blur-xl border-b border-white/10 shadow-sm fixed top-0 w-full z-50">
<div class="flex justify-between items-center px-gutter h-16">
<button aria-label="Menu" class="text-on-surface-variant hover:text-secondary transition-colors active:scale-95 duration-150 p-xs">

</button>

<button aria-label="Settings" class="text-on-surface-variant hover:text-secondary transition-colors active:scale-95 duration-150 p-xs">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</div>
</header>
<main class="pt-24 px-margin-mobile space-y-xl max-w-md mx-auto">
<!-- Intro -->
<section class="space-y-sm">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background">Component Spec</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Visual reference for engineering implementation.</p>
</section>
<!-- 1. Buttons & Actions -->
<section class="space-y-md">
<h3 class="font-label-caps text-label-caps text-secondary uppercase tracking-widest border-b border-white/10 pb-xs">1. Buttons &amp; Actions</h3>
<div class="space-y-md">
<!-- Primary -->
<div class="flex flex-col gap-xs">
<span class="font-data-mono text-data-mono text-on-surface-variant">Primary (Gradient)</span>
<button class="w-full h-12 rounded bg-gradient-primary text-white font-body-md font-semibold hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-sm glow-shadow">
<span class="material-symbols-outlined text-sm" data-icon="bolt" data-weight="fill" style="font-variation-settings: 'FILL' 1;">bolt</span>
                        INITIALIZE SEQUENCE
                    </button>
</div>
<!-- Secondary -->
<div class="flex flex-col gap-xs">
<span class="font-data-mono text-data-mono text-on-surface-variant">Secondary (Outline)</span>
<button class="w-full h-12 rounded border border-secondary text-secondary font-body-md hover:bg-secondary/10 active:scale-[0.98] transition-all">
                        RUN DIAGNOSTICS
                    </button>
</div>
<!-- Tertiary/Ghost -->
<div class="flex flex-col gap-xs">
<span class="font-data-mono text-data-mono text-on-surface-variant">Tertiary (Flux Indicator)</span>
<button class="w-full h-12 border-l-[4px] border-tertiary bg-surface-container hover:bg-surface-container-high text-on-surface font-data-mono flex items-center px-md transition-colors">
                        &gt; view_logs()
                    </button>
</div>
<!-- Disabled -->
<div class="flex flex-col gap-xs">
<span class="font-data-mono text-data-mono text-on-surface-variant opacity-50">Disabled State</span>
<button class="w-full h-12 rounded bg-surface-container-highest text-on-surface-variant opacity-50 cursor-not-allowed font-body-md" disabled="">
                        SYSTEM LOCKED
                    </button>
</div>
</div>
</section>
<!-- 4. Data Cards -->
<section class="space-y-md">
<h3 class="font-label-caps text-label-caps text-secondary uppercase tracking-widest border-b border-white/10 pb-xs">4. Data Cards</h3>
<div class="glass-panel p-md rounded-xl space-y-md relative overflow-hidden">

<div class="absolute -top-10 -right-10 w-32 h-32 bg-primary/20 rounded-full blur-3xl pointer-events-none"></div>
<div class="flex justify-between items-start">
<div class="space-y-xs">

</div>

</div>

</div>
<div>

</div>
</div>
